<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lector de Facturas</title>

    <link rel="stylesheet" href="/static/styles.css?v=1">
</head>

<body>

    <div id="seccionLogin">

        <h2>Iniciar sesión</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Correo electrónico"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Contraseña"
        >

        <button id="botonLogin" type="button">
            Iniciar sesión
        </button>

        <p id="mensajeLogin"></p>

        <button id="mostrarRegistro" type="button">
            Crear una cuenta
        </button>

    </div>

    <div id="seccionRegistro" style="display: none;">

        <h2>Crear cuenta</h2>

        <input
            type="text"
            id="registroNombre"
            placeholder="Nombre"
        >

        <input
            type="email"
            id="registroEmail"
            placeholder="Correo electrónico"
        >

        <input
            type="password"
            id="registroPassword"
            placeholder="Contraseña"
        >

        <button id="botonRegistro" type="button">
            Crear cuenta
        </button>

        <p id="mensajeRegistro"></p>

    </div>

    <div id="seccionUsuario" style="display: none;">
        <p id="bienvenidaUsuario"></p>

        <button id="botonCerrarSesion" type="button">
            Cerrar sesión
        </button>
    </div>

   <div id="aplicacion" class="contenedor" style="display: none;">

        <h1>Lector de Facturas</h1>
        <p>
            Sube una fotografía o un PDF de una factura.
        </p>

        <button type="button" id="botonArchivo">
            📁 Subir JPG / PDF
        </button>

        <input
            type="file"
            id="archivo"
            accept=".jpg,.jpeg,.png,.pdf"
            hidden
        >

        <h3>O tomar una foto</h3>

        <button type="button" id="botonCamara">
            📷 Tomar foto
        </button>

        <input
            type="file"
            id="camara"
            accept="image/*"
            capture="environment"
            hidden
        >

        <p id="nombreArchivo">
            Ningún archivo seleccionado
        </p>

        <button id="botonAnalizar">
            Analizar factura
        </button>

        <button type="button" id="botonHistorial">
            Ver historial de facturas
        </button>

        <button id="botonExcel" type="button">
            Descargar Excel
        </button>

        <h2>Resultado</h2>

        <div id="resultado">
            Aquí aparecerá la información de la factura.
        </div>

        <script src="/static/app.js?v=226"></script>

   </div>
</body>

</html>
